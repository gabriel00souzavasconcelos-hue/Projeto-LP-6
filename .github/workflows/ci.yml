name: Full Project CI

on:
  push:
    branches: [ main, teste ]
  pull_request:
    branches: [ main, teste ]

jobs:
  backend:
    name: Backend Pipeline
    uses: ./.github/workflows/backend-ci.yml

  mobile:
    name: Mobile Pipeline
    uses: ./.github/workflows/mobile-ci.yml

  integration:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Project structure validation
      run: |
        echo "✅ Backend pipeline completed"
        echo "✅ Mobile pipeline completed"
        echo "🎉 Full project CI passed!"

    - name: Generate build report
      if: github.ref == 'refs/heads/main'
      run: |
        echo "## 📊 Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Backend: Build successful" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Mobile: Build successful" >> $GITHUB_STEP_SUMMARY
        echo "- 🚀 Ready for deployment" >> $GITHUB_STEP_SUMMARY

        