name: Full Project CI

on:
  push:
    branches: [ main, teste ]
  pull_request:
    branches: [ main, teste ]

jobs:
  backend:
    name: Backend Pipeline
    uses: ./.github/workflows/backend-ci.yml

  mobile:
    name: Mobile Pipeline
    uses: ./.github/workflows/mobile-ci.yml

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    
    steps:
    - name: Success message
      run: |
        echo "✅ Backend: Passed"
        echo "✅ Mobile: Passed"
        echo "🎉 All CI checks passed!"

