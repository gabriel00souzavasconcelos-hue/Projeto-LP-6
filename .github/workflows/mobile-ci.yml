name: Mobile CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'

jobs:
  test-and-validate:
    name: Test and Validate Mobile App
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check TypeScript types
      run: npx tsc --noEmit

    - name: Validate Expo config
      run: npx expo config --type public

  expo-build:
    name: Build with Expo (Preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-validate
    
    defaults:
      run:
        working-directory: ./mobile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json

    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: Install dependencies
      run: npm ci

    - name: Build preview (Android APK)
      if: secrets.EXPO_TOKEN != ''
      run: |
        echo "Building Android preview..."
        # Uncomment when ready to build
        # eas build --platform android --profile preview --non-interactive
      continue-on-error: true

    - name: Build preview (iOS)
      if: secrets.EXPO_TOKEN != ''
      run: |
        echo "Building iOS preview..."
        # Uncomment when ready to build
        # eas build --platform ios --profile preview --non-interactive
      continue-on-error: true
