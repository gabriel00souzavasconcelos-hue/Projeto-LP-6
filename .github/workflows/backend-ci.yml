name: Backend CI

on:
  push:
    branches: [ main, develop, teste ]
  pull_request:
    branches: [ main, develop, teste ]
  workflow_call:

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Check TypeScript
      run: npx tsc --noEmit

    - name: Build
      run: npm run build
